<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b0d33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NV Map">
  <link rel="apple-touch-icon" href="/public/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/public/app.css">
  <title>Nocturnal Valley Map</title>
</head>
<body class="app">
  <header class="bar">
    <span id="offline" class="badge pending">Saving for offline…</span>
    <span id="gps-status" class="gps-status">GPS off</span>
  </header>

  <nav class="tabs">
    <button id="tab-map" class="tab on" type="button">Map</button>
    <button id="tab-schedule" class="tab" type="button">Schedule</button>
  </nav>

  <main id="map" class="viewer"></main>

  <section id="schedule" class="schedule">
    <div class="sched-bar">
      <div id="sched-days" class="chips"></div>
      <div id="sched-tracks" class="chips"></div>
      <div id="sched-friends-row" class="chips-row" hidden>
        <span class="chips-label">Friends</span>
        <div id="sched-friends" class="chips"></div>
      </div>
      <div class="chips">
        <button id="sched-mine" class="chip mine" type="button">☆ My schedule</button>
        <button id="sched-add" class="chip" type="button">+ Add a set</button>
        <button id="sched-sync" class="chip" type="button">⟳ Sync</button>
      </div>
      <p id="sched-sync-note" class="hint"></p>
      <div id="sched-merge-bar" class="merge-bar" hidden>
        <span id="sched-merge-what"></span>
        <button id="sched-merge-stop" class="btn small" type="button">Cancel</button>
      </div>
    </div>
    <div class="grid-scroll"><div id="sched-grid" class="grid"></div></div>
    <div id="sched-tba" class="tba"></div>
  </section>

  <aside id="sidebar" class="sidebar" aria-label="Saved points">
    <div class="sidebar-head">
      <h2>Points</h2>
      <button id="sidebar-close" class="btn small" type="button">Hide</button>
    </div>
    <ul id="point-list" class="points side"></ul>
  </aside>
  <button id="sidebar-grip" class="sidebar-grip" type="button" aria-label="Open points list"></button>

  <!-- One footer owns the bottom inset. The hint used to sit outside the
       controls with no inset of its own, so a curved screen ate it. -->
  <footer class="dock">
    <div id="hint" class="hint"></div>
    <nav id="controls" class="controls">
      <button id="gps-toggle" class="btn icon primary off" type="button" aria-label="Show my location" title="Show my location">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="2.6" class="solid"></circle>
          <path d="M7 7a7 7 0 0 0 0 10M17 17a7 7 0 0 0 0-10"></path>
          <path d="M4 4a11.5 11.5 0 0 0 0 16M20 20a11.5 11.5 0 0 0 0-16"></path>
          <line class="slash" x1="3.5" y1="20.5" x2="20.5" y2="3.5"></line>
        </svg>
      </button>
      <button id="recenter" class="btn icon" type="button" aria-label="Center on me" title="Center on me" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5"></circle>
          <circle cx="12" cy="12" r="2.4" class="solid"></circle>
          <line x1="12" y1="1.5" x2="12" y2="4.5"></line>
          <line x1="12" y1="19.5" x2="12" y2="22.5"></line>
          <line x1="1.5" y1="12" x2="4.5" y2="12"></line>
          <line x1="19.5" y1="12" x2="22.5" y2="12"></line>
        </svg>
      </button>
      <button id="drop" class="btn icon" type="button" aria-label="Drop a point here" title="Drop a point here">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21.5s6.8-6.2 6.8-11a6.8 6.8 0 1 0-13.6 0c0 4.8 6.8 11 6.8 11z"></path>
          <line x1="12" y1="7" x2="12" y2="13"></line>
          <line x1="9" y1="10" x2="15" y2="10"></line>
        </svg>
      </button>
      <button id="share" class="btn icon" type="button" aria-label="Share points" title="Share points">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6" cy="12" r="2.6"></circle>
          <circle cx="17.5" cy="5.5" r="2.6"></circle>
          <circle cx="17.5" cy="18.5" r="2.6"></circle>
          <line x1="8.3" y1="10.7" x2="15.2" y2="6.8"></line>
          <line x1="8.3" y1="13.3" x2="15.2" y2="17.2"></line>
        </svg>
      </button>
    </nav>

    <!-- Swaps in while a point is being placed, so the only two choices on
         screen are the two that matter. -->
    <nav id="confirm-bar" class="controls" hidden>
      <button id="place-ok" class="btn place-yes" type="button">✓ Place here</button>
      <button id="place-cancel" class="btn place-no" type="button">✕ Cancel</button>
    </nav>
  </footer>

  <div id="scrim" class="scrim" hidden></div>

  <section id="point-form" class="sheet" hidden>
    <h2>Name this point</h2>
    <input id="label" class="field" type="text" placeholder="e.g. Nebula river bend" autocomplete="off">
    <textarea id="note" class="field" rows="2" placeholder="Note (optional)"></textarea>
    <label class="photo-pick">
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <span class="btn">Take or choose a photo</span>
      <span id="photo-name" class="pt-meta">No photo</span>
    </label>
    <div class="cal-row">
      <button id="form-save" class="btn primary" type="button">Save point</button>
      <button id="form-cancel" class="btn" type="button">Cancel</button>
    </div>
  </section>

  <section id="point-detail" class="callout" hidden>
    <h2 id="detail-name"></h2>
    <img id="detail-photo" class="detail-thumb" alt="" hidden>
    <p id="detail-note" class="pt-meta"></p>
    <p id="detail-origin" class="pt-meta"></p>
    <div class="cal-row">
      <button id="detail-edit" class="btn small" type="button">Edit</button>
      <button id="detail-delete" class="btn small" type="button">Delete</button>
      <button id="detail-close" class="btn small" type="button">Close</button>
    </div>
  </section>

  <section id="sched-editor" class="sheet" hidden>
    <h2>Change this set</h2>
    <input id="sched-ed-title" class="field" type="text" placeholder="Act" autocomplete="off">
    <div class="cal-row">
      <select id="sched-ed-day" class="field"></select>
      <select id="sched-ed-track" class="field"></select>
    </div>
    <div class="cal-row">
      <input id="sched-ed-start" class="field time" type="text" inputmode="numeric" placeholder="Start 21:30" autocomplete="off">
      <input id="sched-ed-end" class="field time" type="text" inputmode="numeric" placeholder="End 23:00" autocomplete="off">
    </div>
    <input id="sched-ed-note" class="field" type="text" placeholder="Note (optional)" autocomplete="off">
    <p id="sched-ed-hint" class="hint"></p>
    <div class="cal-row">
      <button id="sched-ed-save" class="btn primary" type="button">Save</button>
      <button id="sched-ed-merge" class="btn small" type="button">Merge b2b…</button>
      <button id="sched-ed-cancel" class="btn small" type="button">Mark cancelled</button>
      <button id="sched-ed-reset" class="btn small" type="button">Undo my changes</button>
      <button id="sched-ed-close" class="btn small" type="button">Close</button>
    </div>
  </section>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="">
  </div>

  <section id="share-panel" class="sheet" hidden>
    <h2>Share points</h2>
    <input id="share-name" class="field" type="text" placeholder="Your name or camp (optional)" autocomplete="off">
    <label class="pick-all"><input id="share-schedule" type="checkbox" checked> <span id="share-schedule-label">My schedule</span></label>
    <label class="pick-all"><input id="share-edits" type="checkbox" checked> <span id="share-edits-label">Schedule corrections</span></label>
    <ul id="share-list" class="points pick"></ul>
    <div class="cal-row">
      <button id="share-go" class="btn primary" type="button">Show QR</button>
      <button id="receive-go" class="btn" type="button">Receive</button>
      <button id="share-close" class="btn" type="button">Close</button>
    </div>
    <h2>Received</h2>
    <ul id="bundle-list" class="points"></ul>
  </section>

  <section id="qr-view" class="sheet full" hidden>
    <canvas id="qr" width="720" height="720"></canvas>
    <p id="qr-count" class="qr-count"></p>
    <button id="qr-done" class="btn" type="button">Done</button>
  </section>

  <section id="scan-view" class="sheet full scan" hidden>
    <video id="video" playsinline muted></video>
    <canvas id="scan-canvas" hidden></canvas>
    <p id="scan-count" class="qr-count"></p>
    <button id="scan-cancel" class="btn" type="button">Cancel</button>
  </section>

  <div id="fatal" class="fatal" hidden></div>

  <script src="/public/qrcode.min.js"></script>
  <script src="/public/jsQR.min.js"></script>
  <script src="/public/geo.js"></script>
  <script src="/public/viewer.js"></script>
  <script src="/public/store.js"></script>
  <script src="/public/share.js"></script>
  <script src="/public/schedule.js"></script>
  <script src="/public/points.js"></script>
  <script src="/public/app.js"></script>
</body>
</html>
